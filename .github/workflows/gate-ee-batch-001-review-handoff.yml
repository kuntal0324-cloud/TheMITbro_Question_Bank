name: GATE EE Batch 001 Review Handoff

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-review-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate Batch 001 review and Formatter handoff
        run: python scripts/validate_gate_ee_batch_001_review_handoff.py
